[build]
  command = "npm install --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/informacoes/undefined-para-*"
  to = "/informacoes/chatbot-para-:splat"
  status = 301
  force = true

[[redirects]]
  from = "/informacoes/*"
  to = "/informacoes/:splat/index.html"
  status = 200

[[redirects]]
  from = "/parceiros/*"
  to = "/parceiros/:splat/index.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat/index.html"
  status = 200

[[redirects]]
  from = "/politica-privacidade"
  to = "/politica-privacidade/index.html"
  status = 200

[[redirects]]
  from = "/termos-uso"
  to = "/termos-uso/index.html"
  status = 200

[[redirects]]
  from = "/cookies"
  to = "/cookies/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
